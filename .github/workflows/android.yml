name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar web y plugins con Android
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}

      - name: Renombrar APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/debug/app-debug.apk "TOEFL-Trainer-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TOEFL-Trainer-apk
          path: TOEFL-Trainer-*.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: TOEFL Trainer ${{ env.VERSION }} (build ${{ github.run_number }})
          body: APK de TOEFL Trainer. Descárgalo en el teléfono e instálalo (permite "instalar apps de origen desconocido" si Android lo pide).
          files: TOEFL-Trainer-*.apk
          make_latest: true
